name: Essai Android

# Branches « essai/… » : compile seulement l'APK, pour vérifier une modification avant de la publier.
on:
  push:
    branches: ["essai/**"]

jobs:
  android:
    name: Compiler l'APK (essai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer le lecteur
        run: python3 apps/prepare_web.py apps/android/www 0.0.0
      - name: Créer le projet Android
        working-directory: apps/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          python3 patch_android.py 0.0.0 1
          npx cap sync android
      - name: Compiler l'APK
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
