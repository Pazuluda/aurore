<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>aurore</title>
<meta name="description" content="Ta musique, rangée et vivante : bibliothèque automatique, visualiseurs animés et découvertes d'artistes.">
<meta name="theme-color" content="#07070d">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="aurore">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: three glass panes (bibliothèque · scène · en cours) floating over a living aurora
   tinted by the album that plays; the player dock runs along the bottom. Dark by choice. */
:root {
  color-scheme: dark;
  --ink-0: #07070d;
  --ink-1: #0e0d19;
  --ink-2: #15142a;
  --ink-3: #1f1d39;
  --ink-4: #2c2a4d;
  --text: #f4f2ff;
  --text-2: #b4b1d2;
  --text-3: #8c89b0;
  --line: rgba(196, 190, 255, .09);
  --line-2: rgba(196, 190, 255, .17);
  --c1: #a08cff;
  --c2: #3fe0c5;
  --c3: #ff7ab6;
  --on-c1: #0b0a14;
  --danger: #ff6b7a;
  --pane: rgba(13, 12, 24, .78);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-pane: 18px;
  --r-card: 12px;
  --r-sm: 8px;
  --row: 56px;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-in: cubic-bezier(.4, 0, 1, 1);
  --t-fast: 140ms;
  --t-med: 240ms;
}
@property --c1 { syntax: "<color>"; inherits: true; initial-value: #a08cff; }
@property --c2 { syntax: "<color>"; inherits: true; initial-value: #3fe0c5; }
@property --c3 { syntax: "<color>"; inherits: true; initial-value: #ff7ab6; }
:root { transition: --c1 1.2s ease, --c2 1.2s ease, --c3 1.2s ease; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink-0);
  color: var(--text);
  font: 15px/1.45 var(--f-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; border-radius: 6px; }
::selection { background: color-mix(in srgb, var(--c1) 45%, transparent); }
* { scrollbar-width: thin; scrollbar-color: var(--ink-4) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 24px; height: 24px; }

/* ---------- aurora ---------- */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.aurora-pulse { position: absolute; inset: -15%; will-change: transform; transform: scale(calc(1 + var(--pulse, 0) * .07)); }
.aurora i {
  position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
  opacity: .5; will-change: transform;
  animation: drift 28s ease-in-out infinite alternate;
  animation-play-state: var(--drift, paused);
}
.aurora .b1 { left: -10%; top: -25%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c1) 70%, transparent), transparent); }
.aurora .b2 { right: -20%; top: 10%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c2) 45%, transparent), transparent); animation-duration: 34s; animation-delay: -9s; }
.aurora .b3 { left: 20%; bottom: -40%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c3) 45%, transparent), transparent); animation-duration: 40s; animation-delay: -17s; }
@keyframes drift {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); }
  50% { transform: translate(8vmax, 5vmax) rotate(40deg) scale(1.1); }
  100% { transform: translate(-6vmax, 9vmax) rotate(-20deg) scale(.95); }
}
.grain {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------- app grid ---------- */
.app {
  position: relative; z-index: 1; height: 100%;
  display: grid; gap: 8px;
  grid-template-columns: 248px minmax(0, 1fr) 340px;
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "side main np" "dock dock dock";
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app.np-off { grid-template-columns: 248px minmax(0, 1fr); grid-template-areas: "side main" "dock dock"; }
.app.np-off .np { display: none; }
.pane { background: var(--pane); border: 1px solid var(--line); border-radius: var(--r-pane); min-height: 0; min-width: 0; }
.side { grid-area: side; display: flex; flex-direction: column; overflow: hidden; }
.main { grid-area: main; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.np { grid-area: np; display: flex; flex-direction: column; overflow: hidden; }
.dock { grid-area: dock; }
.tabs { display: none; }

/* ---------- sidebar ---------- */
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.brand-mark { display: flex; align-items: flex-end; gap: 3px; height: 22px; }
.brand-mark span { width: 4px; border-radius: 2px; background: linear-gradient(var(--c1), var(--c2)); height: 40%; transition: height 90ms linear; }
.brand-name { font: 700 19px/1 var(--f-display); letter-spacing: -.02em; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
.nav-item {
  display: flex; align-items: center; gap: 14px; height: 42px; padding: 0 12px; border-radius: 10px;
  color: var(--text-2); font-weight: 600; font-size: 15px; text-align: left; width: 100%;
  transition: background var(--t-fast), color var(--t-fast);
}
.nav-item:hover { color: var(--text); background: rgba(255, 255, 255, .04); }
.nav-item[aria-current="page"] { color: var(--text); background: rgba(255, 255, 255, .07); }
.nav-item[aria-current="page"] .ic { color: var(--c1); }
.nav-count { margin-left: auto; font: 500 12px var(--f-mono); color: var(--text-3); }
.side-sec { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
.side-lists { flex: 1; overflow-y: auto; padding: 0 10px 10px; min-height: 0; }
.pl-item {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px 8px; border-radius: 10px; text-align: left;
  transition: background var(--t-fast);
}
.pl-item:hover { background: rgba(255, 255, 255, .04); }
.pl-item[aria-current="page"] { background: rgba(255, 255, 255, .07); }
.pl-thumb { width: 40px; height: 40px; border-radius: 8px; flex: none; display: grid; place-items: center; overflow: hidden; background: var(--ink-3); }
.pl-thumb img { width: 100%; height: 100%; object-fit: cover; }
.pl-thumb.liked { background: linear-gradient(135deg, var(--c1), var(--c3)); color: var(--on-c1); }
.pl-thumb.saved { background: linear-gradient(135deg, var(--c2), var(--c1)); color: var(--on-c1); }
.pl-meta { min-width: 0; }
.pl-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-sub { font-size: 13px; color: var(--text-3); }
.side-foot { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.lib-status { font-size: 13px; color: var(--text-3); display: flex; flex-direction: column; gap: 6px; }
.lib-status b { color: var(--text-2); font-weight: 600; }
.progress-line { height: 4px; border-radius: 4px; background: var(--ink-3); overflow: hidden; }
.progress-line > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--c2), var(--c1)); border-radius: 4px; transition: width .3s var(--ease-out); }
.side-actions { display: flex; gap: 6px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px;
  border-radius: 999px; font-weight: 700; font-size: 14px; white-space: nowrap;
  background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2);
  transition: background var(--t-fast), transform var(--t-fast), border-color var(--t-fast);
}
.btn:hover { background: rgba(255, 255, 255, .13); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--c1); color: var(--on-c1); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  color: var(--text-2); transition: color var(--t-fast), background var(--t-fast), transform var(--t-fast);
}
.icon-btn:hover { color: var(--text); background: rgba(255, 255, 255, .07); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.on { color: var(--c1); }
.icon-btn.on::after { content: ""; position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--c1); transform: translateY(15px); }
.icon-btn { position: relative; }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.play-big {
  width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--c1); color: var(--on-c1);
  box-shadow: 0 10px 30px -8px color-mix(in srgb, var(--c1) 70%, transparent);
  transition: transform var(--t-fast) var(--ease-out), filter var(--t-fast);
}
.play-big:hover { transform: scale(1.05); filter: brightness(1.08); }
.play-big:active { transform: scale(.95); }
.play-big .ic { width: 24px; height: 24px; }
.heart.on { color: var(--c3); }
.heart.on .ic { fill: currentColor; }

/* ---------- main / topbar ---------- */
.topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid transparent; position: relative; z-index: 3; transition: border-color var(--t-med), background var(--t-med); }
.main.scrolled .topbar { border-bottom-color: var(--line); background: rgba(13, 12, 24, .6); }
.search { flex: 1 1 auto; min-width: 0; max-width: 440px; position: relative; display: flex; align-items: center; }
.search .ic { position: absolute; left: 14px; color: var(--text-3); pointer-events: none; }
.search input {
  width: 100%; height: 42px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .05);
  padding: 0 40px 0 44px; outline: none; transition: border-color var(--t-fast), background var(--t-fast);
}
.search input::placeholder { color: var(--text-3); }
.search input:focus { border-color: var(--c1); background: rgba(255, 255, 255, .08); }
.search .kbd { position: absolute; right: 12px; font: 500 12px var(--f-mono); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px; }
.topbar .spacer { flex: 1; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; overscroll-behavior: contain; }
#view { padding: 8px 24px 40px; min-height: 100%; }
.banner {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; margin: 4px 0 18px;
  border-radius: var(--r-card); background: color-mix(in srgb, var(--c1) 14%, var(--ink-2)); border: 1px solid color-mix(in srgb, var(--c1) 35%, transparent);
}
.banner p { margin: 0; flex: 1; min-width: 200px; color: var(--text-2); font-size: 14px; }
.banner b { color: var(--text); }

/* ---------- headings & sections ---------- */
h1, h2, h3 { margin: 0; text-wrap: balance; }
.h-page { font: 700 clamp(26px, 3.2vw, 40px)/1.1 var(--f-display); letter-spacing: -.03em; }
.h-sec { font: 700 20px/1.2 var(--f-display); letter-spacing: -.02em; }
.sec { margin-top: 34px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sec-head .link { font-size: 13px; font-weight: 700; color: var(--text-3); }
.sec-head .link:hover { color: var(--text); text-decoration: underline; }
.sub { color: var(--text-2); font-size: 14px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 10px; }
.view-head .sub { margin-top: 6px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap;
  background: rgba(255, 255, 255, .06); border: 1px solid var(--line); color: var(--text-2);
  transition: background var(--t-fast), color var(--t-fast);
}
.chip:hover { color: var(--text); background: rgba(255, 255, 255, .1); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--ink-0); border-color: transparent; }

/* ---------- hero (empty library) ---------- */
.hero {
  position: relative; margin-top: 8px; border-radius: 22px; padding: clamp(24px, 5vw, 56px);
  background:
    radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--c1) 30%, transparent), transparent 60%),
    radial-gradient(120% 140% at 100% 100%, color-mix(in srgb, var(--c2) 22%, transparent), transparent 60%),
    var(--ink-2);
  border: 1px solid var(--line-2); overflow: hidden;
}
.hero h1 { font: 800 clamp(30px, 5vw, 58px)/1.02 var(--f-display); letter-spacing: -.04em; max-width: 14ch; }
.hero p { color: var(--text-2); max-width: 52ch; font-size: 16px; margin: 16px 0 0; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.dropzone {
  margin-top: 28px; border: 2px dashed var(--line-2); border-radius: 16px; padding: 22px; display: flex; align-items: center; gap: 16px;
  color: var(--text-2); background: rgba(14, 13, 25, .55); transition: border-color var(--t-med), background var(--t-med);
}
.dropzone .ic { width: 28px; height: 28px; color: var(--c2); }
.dropzone b { color: var(--text); }
.hero-canvas { position: absolute; right: 0; top: 0; width: min(44%, 500px); height: 62%; opacity: .55; pointer-events: none; -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent); mask-image: linear-gradient(to bottom, #000 40%, transparent); }
.hero > :not(canvas) { position: relative; z-index: 1; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.step { padding: 16px; border-radius: var(--r-card); background: rgba(255, 255, 255, .03); border: 1px solid var(--line); }
.step b { display: block; font-size: 14px; margin-bottom: 4px; }
.step span { font-size: 13px; color: var(--text-3); }

/* ---------- tiles (block-based shortcuts) ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
.tiles.n4, .tiles.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile {
  --tc: var(--c1);
  position: relative; display: flex; align-items: center; gap: 12px; height: 64px; border-radius: 10px; overflow: hidden; text-align: left;
  background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 22%, var(--ink-2)), var(--ink-2) 70%);
  border: 1px solid var(--line); transition: background var(--t-med), transform var(--t-fast);
}
.tile:hover { background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 36%, var(--ink-2)), var(--ink-3) 80%); }
.tile-art { width: 64px; height: 64px; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--tc) 40%, var(--ink-3)); color: var(--text); }
.tile-art img { width: 100%; height: 100%; object-fit: cover; }
.tile-name { font-weight: 700; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tile .mini-play {
  width: 36px; height: 36px; margin-right: 12px; border-radius: 50%; display: grid; place-items: center; background: var(--c1); color: var(--on-c1);
  opacity: 0; transform: translateY(4px); transition: opacity var(--t-fast), transform var(--t-fast) var(--ease-out);
}
.tile:hover .mini-play, .tile:focus-visible .mini-play { opacity: 1; transform: none; }
.mini-play .ic { width: 16px; height: 16px; }

/* ---------- cards ---------- */
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 180px); gap: 16px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px 16px; }
.card { display: flex; flex-direction: column; gap: 10px; padding: 10px; margin: -10px; border-radius: 14px; text-align: left; scroll-snap-align: start; transition: background var(--t-med); min-width: 0; }
.card:hover { background: rgba(255, 255, 255, .045); }
.cover {
  --cc: var(--ink-3);
  position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--cc);
  box-shadow: 0 14px 30px -18px rgba(0, 0, 0, .8);
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .ph { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255, 255, 255, .5); background: linear-gradient(135deg, color-mix(in srgb, var(--cc) 100%, white 6%), color-mix(in srgb, var(--cc) 70%, black)); }
.cover .ph .ic { width: 34%; height: 34%; stroke-width: 1.5; }
.card .card-play {
  position: absolute; right: 10px; bottom: 10px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: var(--c1); color: var(--on-c1); box-shadow: 0 8px 20px rgba(0, 0, 0, .5);
  opacity: 0; transform: translateY(8px); transition: opacity var(--t-med), transform var(--t-med) var(--ease-out);
}
.card:hover .card-play, .card:focus-within .card-play, .card-play.playing { opacity: 1; transform: none; }
.card-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 13px; color: var(--text-3); margin-top: -6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.artist .cover { border-radius: 50%; }
.card.artist { align-items: stretch; }
.card.artist .card-title, .card.artist .card-sub { text-align: center; }
.mosaic { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- detail header (album / artist / playlist) ---------- */
.dhead {
  --hc: var(--c1);
  position: relative; display: flex; align-items: flex-end; gap: 24px; padding: 28px 24px 24px; margin: -8px -24px 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--hc) 46%, transparent), color-mix(in srgb, var(--hc) 8%, transparent) 85%, transparent);
}
.dhead .cover { width: clamp(150px, 20vw, 232px); flex: none; box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .8); }
.dhead.artist .cover { border-radius: 50%; }
.dhead-meta { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.dhead-title { font: 800 clamp(30px, 5.4vw, 76px)/.98 var(--f-display); letter-spacing: -.045em; overflow-wrap: anywhere; }
.dhead-title.long { font-size: clamp(26px, 3.6vw, 48px); }
.dhead-line { font-size: 14px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.dhead-line b { color: var(--text); }
.dhead-line .dot::before { content: "·"; margin-right: 6px; color: var(--text-3); }
.dhead-line button:hover { text-decoration: underline; }
.title-input { font: inherit; letter-spacing: inherit; background: transparent; border: 0; border-bottom: 2px solid var(--c1); outline: none; width: 100%; padding: 0; }
.actions { display: flex; align-items: center; gap: 12px; padding: 22px 0 10px; flex-wrap: wrap; }
.actions .confirm { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); }

/* ---------- track list ---------- */
.tl { --cols: 48px minmax(0, 1.4fr) minmax(0, 1fr) 72px 44px 64px 40px; margin-top: 6px; }
.tl.no-album { --cols: 48px minmax(0, 1fr) 72px 44px 64px 40px; }
.tl-head {
  display: grid; grid-template-columns: var(--cols); align-items: center; gap: 12px; height: 38px; padding: 0 12px;
  border-bottom: 1px solid var(--line); color: var(--text-3); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  position: sticky; top: 0; z-index: 2; background: var(--ink-1);
}
.tl-head button { text-align: left; letter-spacing: inherit; text-transform: inherit; font-weight: inherit; display: inline-flex; gap: 4px; align-items: center; }
.tl-head button:hover, .tl-head button.on { color: var(--text); }
.tl-head .r { justify-self: end; }
.tl-body { position: relative; }
.row {
  display: grid; grid-template-columns: var(--cols); align-items: center; gap: 12px; height: var(--row); padding: 0 12px; border-radius: 8px;
  color: var(--text-2); font-size: 14px; user-select: none;
  transition: background var(--t-fast);
}
.tl-body.virtual .row { position: absolute; left: 0; right: 0; }
.row:hover { background: rgba(255, 255, 255, .055); }
.row.sel { background: rgba(255, 255, 255, .1); }
.row.missing { opacity: .55; }
.c-num { position: relative; display: grid; place-items: center; height: 100%; font: 500 14px var(--f-mono); color: var(--text-3); }
.c-num .rp { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; color: var(--text); }
.row:hover .c-num .n, .row:hover .c-num .eq { opacity: 0; }
.row:hover .c-num .rp, .row:focus-within .c-num .rp { opacity: 1; }
.c-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.c-title img, .c-title .thumb { width: 40px; height: 40px; border-radius: 6px; flex: none; object-fit: cover; background: var(--ink-3); display: grid; place-items: center; color: var(--text-3); }
.c-title .thumb .ic { width: 18px; height: 18px; }
.c-title > div { min-width: 0; }
.t-name { color: var(--text); font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-artist { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-3); }
.t-artist button:hover, .c-album button:hover { color: var(--text); text-decoration: underline; }
.row.now .t-name { color: var(--c1); }
.c-album { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.c-plays, .c-dur { justify-self: end; font: 400 13px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--text-3); }
.c-like .icon-btn, .c-more .icon-btn { width: 34px; height: 34px; }
.c-like .icon-btn:not(.on), .c-more .icon-btn { opacity: 0; }
.row:hover .c-like .icon-btn, .row:hover .c-more .icon-btn, .row:focus-within .c-like .icon-btn, .row:focus-within .c-more .icon-btn { opacity: 1; }
@media (hover: none) { .c-more .icon-btn { opacity: 1; } }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.eq i { width: 3px; background: var(--c1); border-radius: 1px; height: 30%; animation: eq 0.9s ease-in-out infinite; animation-play-state: var(--eq, paused); }
.eq i:nth-child(2) { animation-delay: -.3s; animation-duration: .7s; }
.eq i:nth-child(3) { animation-delay: -.55s; animation-duration: 1.1s; }
@keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
.disc-head { display: flex; align-items: center; gap: 10px; padding: 18px 12px 6px; color: var(--text-3); font-size: 13px; font-weight: 700; }

/* ---------- now playing pane ---------- */
.np-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 6px 18px; }
.np-head .np-ctx { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-body { flex: 1; overflow-y: auto; padding: 4px 16px 16px; min-height: 0; }
.np-cover { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1; background: var(--ink-3); box-shadow: 0 24px 50px -24px color-mix(in srgb, var(--c1) 60%, black); }
.np-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.np-cover .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); }
.np-cover button { position: absolute; right: 10px; top: 10px; background: rgba(7, 7, 13, .55); backdrop-filter: blur(8px); color: var(--text); opacity: 0; transition: opacity var(--t-fast); }
.np-cover:hover button, .np-cover button:focus-visible { opacity: 1; }
.np-titles { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; }
.np-titles > div { flex: 1; min-width: 0; }
.np-title { font: 700 20px/1.2 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.np-artist { color: var(--text-2); margin-top: 4px; font-size: 15px; }
.np-artist button:hover { text-decoration: underline; color: var(--text); }
.viz-box { margin-top: 16px; border-radius: 12px; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); padding: 10px 10px 6px; }
.viz-box canvas { width: 100%; height: 92px; display: block; }
.viz-cap { display: flex; justify-content: space-between; font: 500 11px var(--f-mono); color: var(--text-3); padding-top: 4px; letter-spacing: .04em; }
.q-sec { margin-top: 20px; }
.q-sec h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.q-sec h3 span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-item { display: flex; align-items: center; gap: 2px; border-radius: 8px; transition: background var(--t-fast); }
.q-item:hover { background: rgba(255, 255, 255, .05); }
.q-row { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding: 6px; border-radius: 8px; text-align: left; }
.q-row img, .q-row .thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex: none; background: var(--ink-3); display: grid; place-items: center; color: var(--text-3); }
.q-row > div { min-width: 0; flex: 1; }
.q-row .t-name { font-size: 14px; }
.q-item.now .t-name { color: var(--c1); }
.q-item.now .q-row { cursor: default; }
.q-item .x { opacity: 0; width: 34px; height: 34px; }
.q-item:hover .x, .q-item:focus-within .x { opacity: 1; }
@media (hover: none) { .q-item .x { opacity: 1; } }
.tl-body.virtual .row { top: 0; }
.np-empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--text-3); font-size: 14px; }
.np-empty .big-ic { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; margin: 0 auto 14px; background: rgba(255, 255, 255, .05); color: var(--c1); }

/* ---------- player dock ---------- */
.dock {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1fr); align-items: center; gap: 16px;
  height: 84px; padding: 0 12px; border-radius: var(--r-pane);
  background: rgba(10, 9, 20, .82); border: 1px solid var(--line);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
}
.d-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.d-cover { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; flex: none; background: var(--ink-3); display: grid; place-items: center; color: var(--text-3); }
.d-cover img { width: 100%; height: 100%; object-fit: cover; }
.d-meta { min-width: 0; }
.d-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-artist { font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-artist button:hover { color: var(--text); text-decoration: underline; }
.d-lcd { width: 78px; height: 34px; flex: none; border-radius: 6px; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); padding: 3px; }
.d-lcd canvas { width: 100%; height: 100%; display: block; }
.d-center { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.d-ctrls { display: flex; align-items: center; gap: 10px; }
.d-play { width: 42px; height: 42px; border-radius: 50%; background: var(--text); color: var(--ink-0); display: grid; place-items: center; transition: transform var(--t-fast); }
.d-play:hover { transform: scale(1.06); }
.d-play:active { transform: scale(.94); }
.d-play[disabled] { opacity: .4; pointer-events: none; }
.d-seek { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 620px; }
.d-seek .mono { font-size: 12px; color: var(--text-3); width: 44px; flex: none; }
.d-seek .mono:first-child { text-align: right; }
.d-right { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.vol { display: flex; align-items: center; gap: 4px; }
.vol input { width: 100px; }

input[type="range"] {
  -webkit-appearance: none; appearance: none; height: 20px; background: transparent; cursor: pointer; margin: 0; flex: 1; min-width: 0;
  --p: 0%;
}
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--text) var(--p), rgba(255, 255, 255, .16) var(--p)); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--text) var(--p), rgba(255, 255, 255, .16) var(--p)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text); margin-top: -4px; opacity: 0; transition: opacity var(--t-fast); }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--text); opacity: 0; }
input[type="range"]:hover::-webkit-slider-runnable-track, input[type="range"]:focus-visible::-webkit-slider-runnable-track { background: linear-gradient(90deg, var(--c1) var(--p), rgba(255, 255, 255, .16) var(--p)); }
input[type="range"]:hover::-moz-range-track { background: linear-gradient(90deg, var(--c1) var(--p), rgba(255, 255, 255, .16) var(--p)); }
input[type="range"]:hover::-webkit-slider-thumb, input[type="range"]:focus-visible::-webkit-slider-thumb { opacity: 1; }
input[type="range"]:hover::-moz-range-thumb { opacity: 1; }
input[type="range"]:focus-visible { outline: none; }
.mini-progress { display: none; }

/* ---------- immersive ---------- */
.imm { position: fixed; inset: 0; z-index: 40; background: var(--ink-0); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; opacity: 0; transform: translateY(24px); transition: opacity 320ms var(--ease-out), transform 420ms var(--ease-out); overflow: hidden; }
.imm.open { opacity: 1; transform: none; }
.imm-bg { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(70px) saturate(1.4); opacity: .4; transform: scale(1.1); }
.imm-bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(80% 70% at 50% 45%, transparent, var(--ink-0) 95%); }
.imm canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.imm-top, .imm-bottom { position: relative; z-index: 2; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.imm-top { display: flex; align-items: center; gap: 12px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; }
.imm-top .ctx { flex: 1; text-align: center; min-width: 0; }
.imm-top .ctx small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); font-weight: 700; }
.imm-top .ctx span { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); }
.seg button { height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--ink-0); }
.imm-bottom { padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.imm-meta { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 760px; }
.imm-meta .d-cover { width: 64px; height: 64px; flex: none; }
.imm-meta > div { flex: 1; min-width: 0; }
.imm-title { font: 800 clamp(22px, 3.4vw, 40px)/1.05 var(--f-display); letter-spacing: -.035em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.imm-artist { color: var(--text-2); font-size: 16px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.imm .d-seek { max-width: 760px; }
.imm .d-ctrls { gap: 18px; }
.imm .d-play { width: 64px; height: 64px; }
.imm .d-play .ic { width: 26px; height: 26px; }
.imm-queue {
  position: absolute; z-index: 3; right: max(16px, env(safe-area-inset-right, 0px)); top: 72px; bottom: 210px; width: min(360px, calc(100% - 32px));
  background: rgba(10, 9, 20, .86); border: 1px solid var(--line-2); border-radius: 16px; overflow-y: auto; padding: 10px 12px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}

/* ---------- overlays ---------- */
.drop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(7, 7, 13, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.drop-card { text-align: center; padding: 48px 56px; border-radius: 26px; border: 2px dashed var(--c1); background: color-mix(in srgb, var(--c1) 10%, var(--ink-1)); max-width: calc(100% - 32px); }
.drop-card .ic { width: 48px; height: 48px; color: var(--c1); stroke-width: 1.6; }
.drop-card h2 { font: 700 26px/1.2 var(--f-display); margin-top: 14px; letter-spacing: -.02em; }
.drop-card p { color: var(--text-2); margin: 8px 0 0; }
.menu {
  position: fixed; z-index: 70; min-width: 230px; max-width: calc(100vw - 24px); max-height: min(420px, calc(100vh - 24px)); overflow-y: auto;
  padding: 6px; border-radius: 12px; background: #1a1930; border: 1px solid var(--line-2); box-shadow: 0 24px 60px -10px rgba(0, 0, 0, .7);
  animation: pop 140ms var(--ease-out);
}
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(-4px); } }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; text-align: left; font-size: 14px; font-weight: 500; color: var(--text); }
.menu button:hover, .menu button:focus-visible { background: rgba(255, 255, 255, .08); outline: none; }
.menu button .ic { color: var(--text-3); width: 18px; height: 18px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu .m-title { padding: 8px 12px 6px; font-size: 12px; color: var(--text-3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.toasts { position: fixed; z-index: 80; left: 50%; bottom: 110px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 12px; background: var(--text); color: var(--ink-0); font-size: 14px; font-weight: 600; box-shadow: 0 16px 40px -10px rgba(0, 0, 0, .7); animation: toast-in 260ms var(--ease-out); }
.toast button { font-weight: 800; text-decoration: underline; }
.toast.out { animation: toast-out 180ms var(--ease-in) forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(6px); } }
.sheet { position: fixed; inset: 0; z-index: 65; display: grid; place-items: center; background: rgba(7, 7, 13, .6); padding: 16px; }
.sheet-card { width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; border-radius: 20px; background: var(--ink-1); border: 1px solid var(--line-2); padding: 22px; animation: pop 200ms var(--ease-out); }
.sheet-card h2 { font: 700 22px/1.2 var(--f-display); letter-spacing: -.02em; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); }
.set-row:first-of-type { border-top: 0; }
.set-row p { margin: 4px 0 0; font-size: 13px; color: var(--text-3); }
.set-row b { font-size: 15px; }
.switch { width: 46px; height: 28px; border-radius: 999px; background: var(--ink-4); position: relative; flex: none; transition: background var(--t-fast); }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); transition: transform var(--t-med) var(--ease-out); }
.switch[aria-checked="true"] { background: var(--c1); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-c1); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; color: var(--text-2); margin-top: 12px; }
kbd { font: 500 12px var(--f-mono); padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .05); color: var(--text); white-space: nowrap; justify-self: start; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.stat { padding: 16px; border-radius: var(--r-card); background: rgba(255, 255, 255, .035); border: 1px solid var(--line); min-width: 0; }
.stat small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.stat .v { font: 700 24px/1.2 var(--f-display); letter-spacing: -.02em; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .s { font-size: 13px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 70px; margin-top: 10px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.week i { width: 100%; max-width: 22px; border-radius: 4px 4px 2px 2px; background: linear-gradient(var(--c1), color-mix(in srgb, var(--c1) 40%, var(--ink-3))); min-height: 3px; }
.week i.zero { background: var(--ink-3); }
.week span { font: 500 11px var(--f-mono); color: var(--text-3); }

/* ---------- discover ---------- */
.disc-intro { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; margin-top: 18px; padding: 20px; border-radius: 18px; background: linear-gradient(120deg, color-mix(in srgb, var(--c1) 18%, var(--ink-2)), var(--ink-2) 60%, color-mix(in srgb, var(--c2) 12%, var(--ink-2))); border: 1px solid var(--line-2); }
.disc-intro > div { flex: 1; min-width: 240px; }
.disc-intro p { margin: 6px 0 0; color: var(--text-2); font-size: 14px; max-width: 60ch; }
.disc-seeds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.seed { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .07); color: var(--text-2); }
.disc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 18px; }
.dcard {
  --dc: var(--c1);
  position: relative; padding: 18px; border-radius: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  background: linear-gradient(160deg, color-mix(in srgb, var(--dc) 20%, var(--ink-2)), var(--ink-2) 55%); border: 1px solid var(--line);
  animation: rise 420ms var(--ease-out) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.dcard .dc-top { display: flex; align-items: center; gap: 12px; }
.dc-av { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 800 18px var(--f-display); color: var(--ink-0); background: linear-gradient(135deg, var(--dc), color-mix(in srgb, var(--dc) 40%, white)); }
.dc-name { font: 700 18px/1.15 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.dc-genre { font-size: 13px; color: var(--text-3); margin-top: 2px; }
.dc-why { font-size: 14px; color: var(--text-2); margin: 0; }
.dc-tracks { display: flex; flex-direction: column; gap: 4px; }
.dc-tracks a { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; text-decoration: none; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; }
.dc-tracks a:hover { background: rgba(255, 255, 255, .06); }
.dc-tracks a .ic { color: var(--dc); width: 16px; height: 16px; }
.dc-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
.dc-links a { font-size: 12px; font-weight: 700; text-decoration: none; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text-2); display: inline-flex; align-items: center; gap: 4px; }
.dc-links a:hover { color: var(--text); border-color: var(--text-3); }
.dc-actions { position: absolute; top: 10px; right: 10px; display: flex; }
.dc-actions .icon-btn { width: 34px; height: 34px; }
.skel { border-radius: 16px; height: 230px; background: linear-gradient(100deg, var(--ink-2) 30%, var(--ink-3) 50%, var(--ink-2) 70%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; border: 1px solid var(--line); }

.thinking { display: flex; align-items: center; gap: 12px; margin-top: 18px; color: var(--text-2); font-size: 14px; }

/* ===================== IndexedDB (bibliothèque, pochettes, fichiers, stats) ===================== */
const DB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("aurore", 1);
        r.onupgradeneeded = () => { for (const n of ["tracks", "art", "files", "kv"]) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); };
        r.onsuccess = () => res(r.result);

    } catch { this.db = null; }
    return this.db;
  },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },

    if (!this.db) return undefined;

  },
  async put(store, key, val) {
    if (!this.db) return false;

      await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });

    } catch { /* ignore */ }
  },

  },
  async all(store) {

function artEntry(key) {

  if (!a.smallUrl && a.small) a.smallUrl = URL.createObjectURL(a.small);

const artSmall = (key) => (key && artEntry(key)?.smallUrl) || "";
const artBig = (key) => (key && artEntry(key)?.bigUrl) || "";

/* ---- index (albums, artistes, genres) ---- */
function albumKindLabel(a) {
  if (a.tracks.length <= 3 && a.duration < 900) return "Single";
  if (a.tracks.length <= 6 && a.duration < 1800) return "EP";
  return "Album";
}
function rebuildIndex() {
  const albums = new Map(), artists = new Map(), genres = new Map();
  const artistOf = (name) => {
    const k = norm(name); if (!k) return null;
    let a = artists.get(k);
    if (!a) { a = { key: k, name, tracks: [], albums: new Set(), plays: 0, artKey: "" }; artists.set(k, a); }
    return a;
  };
  for (const t of L.tracks.values()) {
    if (t.albumKey) {
      let a = albums.get(t.albumKey);
      if (!a) { a = { key: t.albumKey, title: t.album, tracks: [], artistCount: new Map(), albumArtist: "", year: 0, genres: new Map(), addedAt: 0, artKey: "", duration: 0, plays: 0, demo: !!t.demo }; albums.set(t.albumKey, a); }
      a.tracks.push(t.id);
      a.artistCount.set(t.artist, (a.artistCount.get(t.artist) || 0) + 1);
      if (t.albumArtist && !a.albumArtist) a.albumArtist = t.albumArtist;
      a.year = Math.max(a.year, t.year || 0);
      if (t.genre) a.genres.set(t.genre, (a.genres.get(t.genre) || 0) + 1);
      a.addedAt = Math.max(a.addedAt, t.addedAt || 0);
      a.duration += t.duration || 0;
      a.plays += L.stats[t.id]?.p || 0;
      if (!a.artKey && L.art.has(t.artKey)) a.artKey = t.artKey;
    }
    for (const name of t.artists) {
      const ar = artistOf(name); if (!ar) continue;
      ar.tracks.push(t.id); ar.plays += L.stats[t.id]?.p || 0;
      if (!ar.artKey && L.art.has(t.artKey)) ar.artKey = t.artKey;
    }
    if (t.genre) for (const g of t.genre.split(/\s*[,;/]\s*/)) if (g) genres.set(g, (genres.get(g) || 0) + 1);
  }
  const byTrackOrder = (x, y) => { const a = L.tracks.get(x), b = L.tracks.get(y); return (a.disc || 1) - (b.disc || 1) || (a.track || 999) - (b.track || 999) || cmp(a.title, b.title); };
  for (const a of albums.values()) {
    a.tracks.sort(byTrackOrder);
    const names = [...a.artistCount.keys()];
    a.artist = a.albumArtist || (names.length === 1 ? names[0] : (() => {
      const top = [...a.artistCount.entries()].sort((x, y) => y[1] - x[1])[0];
      return top[1] >= a.tracks.length * .7 ? top[0] : "Artistes variés";
    })());
    a.genre = [...a.genres.entries()].sort((x, y) => y[1] - x[1])[0]?.[0] || "";
    a.discs = new Set(a.tracks.map((id) => L.tracks.get(id).disc || 1)).size;
    a.kind = albumKindLabel(a);
    if (a.artist !== "Artistes variés") { const ar = artistOf(a.artist); if (ar) { ar.albums.add(a.key); if (!ar.artKey) ar.artKey = a.artKey; } }
    for (const id of a.tracks) for (const n of L.tracks.get(id).artists) { const ar = artists.get(norm(n)); if (ar && a.artist === "Artistes variés") ar.albums.add(a.key); }
  }
  L.albums = albums; L.artists = artists;
  L.genres = [...genres.entries()].sort((x, y) => y[1] - x[1]).map(([g, n]) => ({ name: g, n }));
  L.sorted.tracks = [...L.tracks.values()].sort((a, b) =>
    cmp(artistSortKey(a.albumArtist || a.artist), artistSortKey(b.albumArtist || b.artist)) || (a.year || 0) - (b.year || 0) || cmp(a.album, b.album) || (a.disc || 1) - (b.disc || 1) || (a.track || 999) - (b.track || 999) || cmp(a.title, b.title)
  ).map((t) => t.id);
  L.sorted.albums = [...albums.values()].sort((a, b) => cmp(sortKey(a.artist), sortKey(b.artist)) || (a.year - b.year) || cmp(a.title, b.title)).map((a) => a.key);
  L.sorted.artists = [...artists.values()].sort((a, b) => cmp(artistSortKey(a.name), artistSortKey(b.name))).map((a) => a.key);
  L.version++;
}

const saveStats = debounce(() => {

}, 2500);
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  const score = new Map();
  for (const [id, s] of Object.entries(L.stats)) {
    const t = L.tracks.get(id); if (!t || t.demo) continue;

/* ---- import ---- */
function pickFolderImage(images) {
  const score = (n) => { n = n.toLowerCase(); return /^(cover|front|folder)\./.test(n) ? 4 : /cover|front|folder|albumart/.test(n) ? 3 : /back|cd|disc|inlay|booklet/.test(n) ? 0 : 1; };
  return images.sort((a, b) => score(b.file.name) - score(a.file.name) || b.file.size - a.file.size)[0];
}
const dirOf = (p) => p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "";

async function importEntries(entries, opts = {}) {
  const audio = [], imagesByDir = new Map();
  for (const e of entries) {
    const ext = extOf(e.file.name);
    if (e.file.name.startsWith("._")) continue;
    if (AUDIO_EXT.has(ext) || (e.file.type || "").startsWith("audio/")) audio.push(e);
    else if (IMG_EXT.has(ext)) { const d = dirOf(e.path); (imagesByDir.get(d) || imagesByDir.set(d, []).get(d)).push(e); }
  }
  if (!audio.length) { if (!opts.quiet) toast("Aucun fichier audio trouvé là-dedans."); return; }
  if (L.importing) { if (!opts.quiet) toast("Un import est déjà en cours."); return; }
  loadDemo.busy = false;
  const demoIds = [...L.tracks.values()].filter((t) => t.demo).map((t) => t.id);
  if (demoIds.length) removeTracks(demoIds);
  const root = audio[0].path.includes("/") ? audio[0].path.split("/")[0] : "";
  if (root && root !== L.rootName) { L.rootName = root; DB.put("kv", "root", root); }

  const todo = []; let attached = 0;
  for (const e of audio) {
    const id = "t" + hash(e.path + "|" + e.file.size);
    if (L.tracks.has(id)) { L.files.set(id, e.file); attached++; } else todo.push({ ...e, id });
  }
  L.importing = { done: 0, total: todo.length, attached };
  UI.onLibraryProgress();
  const now = Date.now();
  let batch = [], lastRender = performance.now();
  const artDone = new Set(L.art.keys());
  const flush = async (force) => {
    if (batch.length) { const b = batch; batch = []; await DB.putMany("tracks", b.map((t) => [t.id, t])); }
    if (force || performance.now() - lastRender > 900) { lastRender = performance.now(); rebuildIndex(); UI.onLibraryChanged(); }
  };
  let idx = 0;
  const worker = async () => {
    while (idx < todo.length) {
      const e = todo[idx++];
      let meta = {};
      try { meta = await parseAudioFile(e.file); } catch { meta = {}; }
      if (e.hint) for (const k in e.hint) if (!meta[k] && e.hint[k]) meta[k] = e.hint[k]; /* infos d'Android quand le fichier n'en a pas */
      const guess = inferFromPath(e.path);
      const title = (meta.title || guess.title || e.file.name).trim();
      const artist = (meta.artist || guess.artist || meta.albumArtist || guess.dirArtist || UNKNOWN_ARTIST).trim();
      const album = (meta.album || guess.album || "").trim();
      const dir = (() => { let d = dirOf(e.path); const last = d.split("/").pop(); if (DISC_DIR.test(last)) d = dirOf(d); return d; })();
      const albumKey = album ? "a" + hash(norm(album) + "|" + dir) : "";
      const t = {
        id: e.id, path: e.path, size: e.file.size, name: e.file.name,
        title, artist, artists: splitArtists(artist).length ? splitArtists(artist) : [artist],
        albumArtist: (meta.albumArtist || "").trim(), album, albumKey,
        artKey: albumKey || "s" + e.id,
        year: cleanYear(meta.year || meta.origYear || guess.year), genre: (meta.genre || "").trim(),
        track: cleanNum(meta.track || guess.track), disc: cleanNum(meta.disc || guess.disc) || 1,
        duration: meta.duration && isFinite(meta.duration) ? meta.duration : 0,
        codec: meta.codec || extOf(e.file.name).toUpperCase(), sampleRate: meta.sampleRate || 0, bitrate: meta.bitrate || 0,
        addedAt: now + idx, src: e.file.media ? "media" : e.file.disk ? "disk" : "file",
      };
      if (!artDone.has(t.artKey)) {
        let src = null;
        if (meta.picture && meta.picture.data && meta.picture.data.length > 100) src = new Blob([meta.picture.data], { type: meta.picture.mime });
        else { const imgs = imagesByDir.get(dirOf(e.path)) || imagesByDir.get(dir); if (imgs && imgs.length) src = pickFolderImage(imgs).file; }
        if (src) {
          artDone.add(t.artKey);
          const art = await makeArt(await asBlob(src));
          if (art) { L.art.set(t.artKey, art); DB.put("art", t.artKey, { big: art.big, small: art.small, colors: art.colors }); }
          else artDone.delete(t.artKey);
        }
      }
      if (!t.albumKey && !L.art.has(t.artKey)) t.artKey = "";
      L.tracks.set(t.id, t); L.files.set(t.id, e.file);
      batch.push(t);
      L.importing.done++;
      UI.onLibraryProgress();
      if (batch.length >= 40) await flush(false); else if (performance.now() - lastRender > 900) await flush(false);
    }
  };
  await Promise.all(Array.from({ length: Math.min(4, todo.length || 1) }, worker));
  await flush(true);
  const added = todo.length;
  L.importing = null;
  UI.onLibraryProgress();
  UI.onLibraryChanged();
  if (added && attached) toast(`${plural(added, "nouveau titre", "nouveaux titres")}, ${plural(attached, "titre retrouvé", "titres retrouvés")}.`);
  else if (added) toast(`${plural(added, "titre ajouté", "titres ajoutés")} à ta bibliothèque.`);
  else if (!opts.quiet) toast(`Ta musique est prête : ${plural(attached, "titre", "titres")}.`);
  probeMissingDurations();
  if (NATIVE_WIN) return; /* Windows : les fichiers restent dans tes dossiers, rien à copier */
  if (L.memorize) memorizeFiles();
  else if (IS_MOBILE && added) {
    L.memorize = true; DB.put("kv", "memorize", true); store.set("askedMemo", true); memorizeFiles();
    toast("Ta musique est gardée dans l'app : pas besoin de la réajouter.");
  } else if (!store.get("askedMemo", false) && added) UI.offerMemorize();
}

function removeTracks(ids) {

/* durée inconnue (AAC brut, formats rares) : on demande au navigateur */
async function probeMissingDurations() {
  const ids = [...L.tracks.values()].filter((t) => !t.duration && L.files.has(t.id)).map((t) => t.id).slice(0, 400);
  for (const id of ids) {
    const d = await new Promise((res) => {
      const a = new Audio(); let url = ""; asBlob(L.files.get(id)).then((b) => { url = URL.createObjectURL(b); a.src = url; }, () => done(0));
      let fin = false; const done = (v) => { if (fin) return; fin = true; if (url) URL.revokeObjectURL(url); a.removeAttribute("src"); res(v); };
      a.preload = "metadata"; a.onloadedmetadata = () => done(isFinite(a.duration) ? a.duration : 0); a.onerror = () => done(0);
      setTimeout(() => done(0), 4000);
    });
    if (d) { const t = L.tracks.get(id); if (t) { t.duration = d; DB.put("tracks", id, t); } }

/* ---- garder les fichiers dans le navigateur ---- */
async function memorizeFiles() {
  if (L.memorizing) return;
  const have = new Set(await DB.keys("files"));
  const todo = [...L.files.keys()].filter((id) => !have.has(id) && !L.tracks.get(id)?.demo && !L.files.get(id).disk);
  if (!todo.length) return;
  try { await navigator.storage?.persist?.(); } catch { /* facultatif */ }
  const bytes = todo.reduce((s, id) => s + (L.files.get(id).size || 0), 0);
  try {
    const est = await navigator.storage?.estimate?.();
    if (est && est.quota && est.quota - est.usage < bytes * 1.05) {
      L.memorize = false; DB.put("kv", "memorize", false); UI.onLibraryProgress();
      toast(`Pas assez de place dans le navigateur (${fmtBytes(bytes)} nécessaires). Ta musique reste lue depuis ton dossier.`);
      return;
    }
  } catch { /* estimate indisponible */ }
  L.memorizing = { done: 0, total: todo.length };
  UI.onLibraryProgress();
  for (const id of todo) {
    if (!L.memorize) break;
    try { await DB.put("files", id, L.files.get(id)); }
    catch { L.memorize = false; DB.put("kv", "memorize", false); toast("Le navigateur manque de place, la mémorisation s'arrête ici."); break; }
    L.memorizing.done++;
    if (L.memorizing.done % 5 === 0) UI.onLibraryProgress();
  }
  L.memorizing = null;
  UI.onLibraryProgress();
}
async function forgetFiles() { await DB.clear("files"); }
const libraryBytes = () => { let s = 0; for (const t of L.tracks.values()) if (!t.demo) s += t.size || 0; return s; };
const missingCount = () => { let n = 0; for (const id of L.tracks.keys()) if (!L.files.has(id)) n++; return n; };

/* ---- ouverture du dossier ---- */
async function walkEntry(entry, out) {
  if (entry.isFile) {
    await new Promise((res) => entry.file((f) => { out.push({ file: f, path: entry.fullPath.replace(/^\/+/, "") }); res(); }, () => res()));
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((res) => reader.readEntries(res, () => res([])));
      if (!batch.length) break;
      for (const e of batch) await walkEntry(e, out);
    }
  }
}
async function walkHandle(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === "file") { const ext = extOf(name); if (AUDIO_EXT.has(ext) || IMG_EXT.has(ext)) out.push({ file: await h.getFile(), path: prefix + "/" + name }); }
    else await walkHandle(h, prefix + "/" + name, out);
  }
}
const canPickDir = () => typeof window.showDirectoryPicker === "function" && window.top === window.self;
async function openFolder() {
  if (NATIVE_WIN) return nativePickFolder();
  if (canPickDir()) {
    try {
      const h = await window.showDirectoryPicker({ id: "aurore-musique", mode: "read" });
      L.dirHandle = h; DB.put("kv", "dirHandle", h);
      const out = []; toast("Lecture du dossier…");
      await walkHandle(h, h.name, out);
      return importEntries(out);
    } catch (e) { if (e && e.name === "AbortError") return; }
  }
  $("#pick-dir").click();
}
/* app installée sur PC : si le navigateur se souvient de l'autorisation, on rattache le dossier sans rien demander */
async function autoReattach() {
  if (NATIVE_WIN) return nativeScan({ quiet: true });
  if (AndroidMusic) return AndroidMusic.boot();
  const h = L.dirHandle;
  if (!h || !canPickDir() || !missingCount()) return;
  try {
    if ((await h.queryPermission({ mode: "read" })) !== "granted") return;
    const out = []; await walkHandle(h, h.name, out);
    if (out.length) await importEntries(out);
  } catch { /* le dossier a bougé : la bannière proposera de le rouvrir */ }
}
async function reopenFolder() {
  if (NATIVE_WIN) return nativeScan();
  const h = L.dirHandle;
  if (h && canPickDir()) {
    try {
      if ((await h.queryPermission({ mode: "read" })) !== "granted" && (await h.requestPermission({ mode: "read" })) !== "granted") throw new Error("refusé");
      const out = []; await walkHandle(h, h.name, out); return importEntries(out);
    } catch { /* on retombe sur le sélecteur */ }
  }
  return openFolder();
}

/* ===================== moteur audio ===================== */
const Player = {
  audio: null, ctx: null, src: null, fade: null, vol: null, analyser: null,
  mode: "element", preferBuffer: false, split: false, shadow: null,
  buf: null, bsrc: null, bStart: 0, bOffset: 0,
  url: null, id: null, playing: false, loading: false, token: 0,
  volume: store.get("volume", 0.85), muted: false,
  handlers: {},
  on(ev, fn) { (this.handlers[ev] ||= []).push(fn); },
  emit(ev, ...a) { for (const fn of this.handlers[ev] || []) try { fn(...a); } catch (e) { console.error(e); } },

  init() {
    const a = (this.audio = new Audio());
    a.preload = "auto";
    a.addEventListener("ended", () => { if (this.mode === "element") { this.playing = false; this.emit("ended"); } });
    a.addEventListener("loadedmetadata", () => this.emit("meta"));
    a.addEventListener("error", () => this.onElementError());
    a.addEventListener("pause", () => { if (this.mode === "element" && this.playing && !a.ended && !this._pausing) { this.playing = false; this.emit("state"); } });
    a.addEventListener("play", () => { if (this.mode === "element" && !this.playing) { this.playing = true; this.emit("state"); } });
    // Sur téléphone, le son ne passe pas par Web Audio : iOS coupe Web Audio écran verrouillé.
    // Une copie muette du titre alimente le visualiseur quand l'écran est allumé.
    this.split = IS_MOBILE;
    if (this.split) {
      this.shadow = new Audio(); this.shadow.preload = "auto";
      document.addEventListener("visibilitychange", () => this.syncShadow(true));
    }
    document.addEventListener("securitypolicyviolation", (e) => {
      if (/media/.test(e.effectiveDirective || e.violatedDirective || "") && String(e.blockedURI).startsWith("blob")) this.preferBuffer = true;
    });
  },
  ensureCtx() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        const ctx = (this.ctx = new AC({ latencyHint: "playback" }));
        this.fade = ctx.createGain(); this.vol = ctx.createGain(); this.analyser = ctx.createAnalyser();
        this.analyser.fftSize = 4096; this.analyser.smoothingTimeConstant = .7;
        if (this.split) {
          this.mute = ctx.createGain(); this.mute.gain.value = 0;
          this.fade.connect(this.vol); this.vol.connect(ctx.destination); this.vol.connect(this.analyser);
          this.analyser.connect(this.mute); this.mute.connect(ctx.destination);
          this.src = ctx.createMediaElementSource(this.shadow); this.src.connect(this.analyser);
        } else {
          this.fade.connect(this.vol); this.vol.connect(this.analyser); this.analyser.connect(ctx.destination);
          this.src = ctx.createMediaElementSource(this.audio); this.src.connect(this.fade);
        }

/* ===================== file d'attente (logique Spotify) ===================== */
const Q = {
  ctx: [], label: "", ref: null, order: [], pos: -1, manual: [],
  shuffle: store.get("shuffle", false), repeat: store.get("repeat", "off"),
  current: null, fromManual: false, session: null,

  playList(ids, start = 0, label = "", ref = null) {
    ids = ids.filter((id) => L.tracks.has(id));
    if (!ids.length) return;
    this.ctx = ids.slice(); this.label = label; this.ref = ref;
    this.buildOrder(clamp(start, 0, ids.length - 1));
    this.go(this.ctx[this.order[this.pos]], { fromManual: false });
  },
  buildOrder(startIdx) {
    const idx = [...this.ctx.keys()];
    if (this.shuffle) { const rest = shuffleArr(idx.filter((i) => i !== startIdx)); this.order = startIdx >= 0 ? [startIdx, ...rest] : rest; this.pos = 0; }
    else { this.order = idx; this.pos = Math.max(0, startIdx); }
  },
  async go(id, { fromManual = false, autoplay = true, startAt = 0 } = {}) {
    if (!L.files.has(id)) {
      const anyPlayable = this.ctx.some((x) => L.files.has(x)) || this.manual.some((x) => L.files.has(x));
      if (!anyPlayable) { UI.needFiles(); return; }
      toast("Fichier introuvable, je passe au suivant.");
      this.current = id; return this.next(false);
    }
    this.flushSession();
    this.current = id; this.fromManual = fromManual;
    this.session = { id, listened: 0, counted: false, last: null };
    this.save();
    await Player.load(id, { autoplay, startAt });
  },
  next(auto = false) {
    if (auto && this.repeat === "one" && this.current) { Player.seek(0); Player.play(); if (this.session) this.session.counted = false; return; }
    if (this.manual.length) { const id = this.manual.shift(); UI.onQueueChanged(); return this.go(id, { fromManual: true }); }
    if (this.pos + 1 < this.order.length) { this.pos++; return this.go(this.ctx[this.order[this.pos]]); }
    if (this.repeat !== "off" && this.order.length) {
      if (this.shuffle) this.buildOrder(-1); this.pos = 0;
      return this.go(this.ctx[this.order[this.pos]]);
    }
    Player.pause(); Player.seek(0); UI.onQueueChanged();
  },
  prev() {
    if (Player.currentTime > 3 || this.pos <= 0) { Player.seek(0); if (!Player.playing) Player.play(); return; }
    this.pos--; this.go(this.ctx[this.order[this.pos]]);
  },
  jumpTo(orderPos) { this.pos = orderPos; this.go(this.ctx[this.order[this.pos]]); },
  playManual(i) { const id = this.manual.splice(i, 1)[0]; if (id) this.go(id, { fromManual: true }); },
  toggleShuffle() {
    this.shuffle = !this.shuffle; store.set("shuffle", this.shuffle);
    if (this.ctx.length) {
      const curIdx = this.order[this.pos];
      if (this.shuffle) this.buildOrder(curIdx ?? -1); else { this.order = [...this.ctx.keys()]; this.pos = curIdx ?? 0; }
    }
    UI.onQueueChanged(); UI.syncControls();
  },
  cycleRepeat() {
    this.repeat = this.repeat === "off" ? "all" : this.repeat === "all" ? "one" : "off"; store.set("repeat", this.repeat);
    UI.syncControls();
    if (NP && Player.mode === "native") NP.refreshSoon();
  },
  /* Android : le service est passé à un autre titre (enchaînement, notification, casque, montre) */
  adoptNative(id, idx, reason) {
    if (reason === 1) this.creditEnd();
    const w = NP.win;
    let j = w[idx] && w[idx].id === id ? idx : -1;
    if (j < 0) for (let k = 0; k < w.length; k++) if (w[k].id === id && (j < 0 || Math.abs(k - NP.cur) < Math.abs(j - NP.cur))) j = k;
    if (j >= 0) {
      for (let k = NP.cur + 1; k <= j; k++) if (w[k] && w[k].src === "m") { const i = this.manual.indexOf(w[k].id); if (i >= 0) this.manual.splice(i, 1); }
      const m = w[j];
      if (m.p != null && m.p < this.order.length && this.ctx[this.order[m.p]] === id) this.pos = m.p;
      else if (m.src === "?") this.locate(id);
      this.fromManual = m.src === "m" || m.src === "cm";
      NP.cur = j;
    } else this.locate(id);
    this.flushSession();
    this.current = id; this.session = { id, listened: 0, counted: false, last: null };
    UI.onQueueChanged(); this.saveNow(); /* tout de suite : l'app peut être fermée à tout moment */
  },
  locate(id) {
    const i = this.manual.indexOf(id);
    if (i >= 0) { this.manual.splice(0, i + 1); this.fromManual = true; return; }
    const n = this.order.length; this.fromManual = false;
    for (let k = 1; k <= n; k++) { const p = (this.pos + k + n) % n; if (this.ctx[this.order[p]] === id) { this.pos = p; return; } }
  },
  /* titre allé jusqu'au bout pendant que l'app dormait : on compte la fin de l'écoute */
  creditEnd() {
    const s = this.session; if (!s || s.id !== Player.id) return;
    const dur = L.tracks.get(s.id)?.duration || 0; if (!dur) return;
    const rest = s.last == null ? (s.listened ? 0 : dur) : Math.max(0, dur - s.last);
    if (rest > 0 && rest < 900) { s.listened += rest; s.pending = (s.pending || 0) + rest; }
    if (!s.counted && s.listened >= Math.min(30, dur * .5)) { s.counted = true; if (!L.tracks.get(s.id)?.demo) countPlay(s.id); UI.onStatsChanged(); }
    s.last = dur;
  },
  addNext(ids) { this.manual.unshift(...ids.filter((id) => L.tracks.has(id))); UI.onQueueChanged(); },
  addEnd(ids) { this.manual.push(...ids.filter((id) => L.tracks.has(id))); UI.onQueueChanged(); },
  upcoming(n = 40) { const out = []; for (let i = this.pos + 1; i < this.order.length && out.length < n; i++) out.push({ id: this.ctx[this.order[i]], pos: i }); return out; },

  tick() {
    Player.syncShadow(false);
    const s = this.session; if (!s || !Player.playing || Player.id !== s.id) { if (s) s.last = null; return; }
    const t = Player.currentTime, now = Date.now();
    if (s.last != null) {
      const d = t - s.last, real = (now - (s.wall || now)) / 1000;
      if (d > 0 && d < Math.max(2, real + 1.5)) { s.listened += d; s.pending = (s.pending || 0) + d; }
    }
    s.last = t; s.wall = now;
    const dur = Player.duration || 1;
    if (!s.counted && s.listened >= Math.min(30, dur * .5)) { s.counted = true; if (!L.tracks.get(s.id)?.demo) countPlay(s.id); UI.onStatsChanged(); }
    if (s.pending > 10) this.flushSession();
  },
  flushSession() { const s = this.session; if (s && s.pending > .5) { if (!L.tracks.get(s.id)?.demo) addListened(s.id, s.pending); s.pending = 0; } },
  saveNow() {
    store.set("q", { ctx: Q.ctx.slice(0, 3000), label: Q.label, ref: Q.ref, order: Q.order.slice(0, 3000), pos: Q.pos, manual: Q.manual.slice(0, 200), current: Q.current, t: Player.currentTime });
  },
  save: debounce(() => Q.saveNow(), 800),
  restore() {
    const s = store.get("q", null); if (!s || !s.current || !L.tracks.has(s.current)) return;
    this.ctx = (s.ctx || []).filter((id) => L.tracks.has(id)); this.label = s.label || ""; this.ref = s.ref || null;
    this.order = (s.order || []).filter((i) => i < this.ctx.length); if (this.order.length !== this.ctx.length) this.order = [...this.ctx.keys()];
    this.pos = clamp(s.pos || 0, 0, Math.max(0, this.order.length - 1)); this.manual = (s.manual || []).filter((id) => L.tracks.has(id));
    this.current = s.current;
    if (L.files.has(s.current)) { this.session = { id: s.current, listened: 0, counted: false, last: null }; Player.load(s.current, { autoplay: false, startAt: s.t || 0 }); }
    else UI.showIdleTrack(s.current);
  },
};

/* ===================== visualiseurs ===================== */
const Viz = {
  analyser: null, sr: 48000, freq: null, wave: null,
  N: 96, bands: new Float32Array(96), peaks: new Float32Array(96), hold: new Uint8Array(96), pvel: new Float32Array(96),
  bass: 0, bassAvg: 0, beat: 0, level: 0, sinceBeat: 0,
  targets: new Set(), running: false, mode: store.get("vizMode", "halo"), calm: false,
  col: { c1: [160, 140, 255], c2: [63, 224, 197], c3: [255, 122, 182] }, tcol: null,
  cover: null, coverAngle: 0, coverSpin: true, particles: [],
  idleShape: Array.from({ length: 96 }, (_, i) => { const x = i / 95; return clamp(.55 * Math.exp(-((x - .12) ** 2) / .02) + .38 * Math.exp(-((x - .42) ** 2) / .03) + .22 * Math.exp(-((x - .72) ** 2) / .02) + .06, 0, 1); }),

  attach(analyser, sr) { this.webAn = analyser; this.webSr = sr; if (!this.nativeOn) this.use(analyser, sr); },
  use(analyser, sr) {
    this.analyser = analyser; this.sr = sr;

  },
  /* Android : le spectre vient du lecteur natif (NV) au lieu de Web Audio */
  setNative(on) { this.nativeOn = on; if (on) this.use(NV, NV.sr); else this.use(this.webAn || null, this.webSr || 48000); },
  add(canvas, kind) {
    const t = { canvas, kind, g: canvas.getContext("2d"), w: 0, h: 0, dpr: 1, idleDrawn: false };
    const resize = () => {
      const r = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, kind === "imm" ? 1.5 : 2);
      t.w = Math.max(1, Math.round(r.width)); t.h = Math.max(1, Math.round(r.height)); t.dpr = dpr;
      canvas.width = Math.round(t.w * dpr); canvas.height = Math.round(t.h * dpr);

  remove(canvas) { for (const t of this.targets) if (t.canvas === canvas) { t.ro.disconnect(); this.targets.delete(t); } },
  prune() { for (const t of this.targets) if (!t.canvas.isConnected) { t.ro.disconnect(); this.targets.delete(t); } },

  parseColor(str) {

    if (v.startsWith("#")) return [parseInt(v.slice(1, 3), 16), parseInt(v.slice(3, 5), 16), parseInt(v.slice(5, 7), 16)];
    const m = v.match(/[\d.]+/g); return m ? m.slice(0, 3).map(Number) : [160, 140, 255];
  },
  setPalette(p) {
    p = p || DEFAULT_PAL;
    this.tcol = { c1: this.parseColor(p.c1), c2: this.parseColor(p.c2), c3: this.parseColor(p.c3) };
    this.kick();
  },
  setCover(url) {
    if (!url) { this.cover = null; this.kick(); return; }
    const img = new Image(); img.onload = () => { this.cover = img; this.kick(); }; img.src = url;
  },
  rgba(c, a) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; },
  mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; },

  kick() { if (!this.running) { this.running = true; requestAnimationFrame((ts) => this.frame(ts)); } },
  compute() {
    const playing = Player.playing && this.analyser;
    const N = this.N;
    if (playing) {
      const nat = this.analyser.native, fresh = nat && performance.now() - this.analyser.at < 500;
      if (nat) { for (let k = 0; k < this.wave.length; k++) this.wave[k] = fresh ? this.analyser.wave[k] : 128; }

const ROW = 56;

function toast(msg, opts = {}) {
  const box = $("#toasts"); if (!box) return;
  const el = document.createElement("div"); el.className = "toast";
  const span = document.createElement("span"); span.textContent = msg; el.append(span);
  if (opts.action) {
    const b = document.createElement("button"); b.textContent = opts.action.label;
    b.onclick = () => { opts.action.fn(); close(); }; el.append(b);
  }
  box.append(el);
  while (box.children.length > 3) box.firstChild.remove();
  let gone = false;
  const close = () => { if (gone) return; gone = true; el.classList.add("out"); setTimeout(() => el.remove(), 200); };
  setTimeout(close, opts.ms || (opts.action ? 7000 : 3200));
}

/* ---- menu contextuel ---- */
const Menu = {
  el: null, pages: [], anchor: null,
  open(at, items) {
    this.el = $("#menu"); this.pages = [items]; this.anchor = at; this.draw();
  },
  push(items) { this.pages.push(items); this.draw(); },
  pop() { this.pages.pop(); this.draw(); },
  draw() {
    const items = this.pages[this.pages.length - 1]; const el = this.el;
    el.innerHTML = "";
    if (this.pages.length > 1) items.unshift({ icon: "back", label: "Retour", keep: true, fn: () => this.pop() });
    for (const it of items) {
      if (it === "sep") { el.append(document.createElement("hr")); continue; }
      if (it.title) { const d = document.createElement("div"); d.className = "m-title"; d.textContent = it.title; el.append(d); continue; }
      const b = document.createElement("button"); b.setAttribute("role", "menuitem");
      b.innerHTML = icon(it.icon || "right").s; const s = document.createElement("span"); s.textContent = it.label; b.append(s);
      if (it.sub) b.insertAdjacentHTML("beforeend", `<span style="margin-left:auto;color:var(--text-3)">${icon("right", "sm").s}</span>`);
      b.onclick = (e) => { e.stopPropagation(); if (it.sub) return this.push(it.sub()); if (!it.keep) this.close(); it.fn && it.fn(); };
      el.append(b);
    }
    el.hidden = false;
    const r = el.getBoundingClientRect(); let x, y;
    if (this.anchor instanceof Element) { const a = this.anchor.getBoundingClientRect(); x = a.right - r.width; y = a.bottom + 6; if (y + r.height > innerHeight - 12) y = a.top - r.height - 6; }
    else { x = this.anchor.x; y = this.anchor.y; }
    el.style.left = clamp(x, 12, innerWidth - r.width - 12) + "px";
    el.style.top = clamp(y, 12, innerHeight - r.height - 12) + "px";
    const first = el.querySelector("button"); first && first.focus({ preventScroll: true });
  },
  close() { if (this.el) { this.el.hidden = true; this.el.innerHTML = ""; } this.pages = []; },
  get isOpen() { return this.el && !this.el.hidden; },
};

function sortedTrackIds(s) {
  const base = L.sorted.tracks.slice();
  if (!s || s.key === "default") return base;
  const T = (id) => L.tracks.get(id); const d = s.dir;
  const f = {
    title: (a, b) => cmp(T(a).title, T(b).title),
    album: (a, b) => cmp(T(a).album || "￿", T(b).album || "￿") || (T(a).disc - T(b).disc) || (T(a).track - T(b).track),
    plays: (a, b) => playsOf(a) - playsOf(b),
    duration: (a, b) => (T(a).duration || 0) - (T(b).duration || 0),
    added: (a, b) => (T(a).addedAt || 0) - (T(b).addedAt || 0),
  }[s.key];
  return f ? base.sort((a, b) => f(a, b) * d) : base;
}
function artistTrackIds(key) {
  const ar = L.artists.get(key); if (!ar) return [];
  const T = (id) => L.tracks.get(id);
  return ar.tracks.slice().sort((a, b) => playsOf(b) - playsOf(a) || (T(b).year || 0) - (T(a).year || 0) || cmp(T(a).album, T(b).album) || (T(a).disc - T(b).disc) || (T(a).track - T(b).track));
}
function listSpec(id) {
  const hasT = (x) => L.tracks.has(x);
  if (id === "liked") return { name: "Titres likés", kind: "Playlist", ids: [...L.likes].reverse().filter(hasT), auto: true, ic: "heart", empty: "Touche le cœur à côté d'un titre pour le retrouver ici." };
  if (id === "top") return { name: "Les plus écoutés", kind: "Playlist auto", ids: topTracks(50), auto: true, ic: "bars", empty: "Écoute un peu de musique : tes 50 titres préférés apparaîtront ici, classés par nombre d'écoutes." };
  if (id === "never") return { name: "Jamais écoutés", kind: "Playlist auto", ids: L.sorted.tracks.filter((x) => !playsOf(x)).sort((a, b) => (L.tracks.get(b).addedAt || 0) - (L.tracks.get(a).addedAt || 0)), auto: true, ic: "sparkles", empty: "Tu as tout écouté. Respect." };
  if (id === "recent") { const seen = new Set(), ids = []; for (let i = L.history.length - 1; i >= 0 && ids.length < 50; i--) { const x = L.history[i][0]; if (!seen.has(x) && hasT(x)) { seen.add(x); ids.push(x); } } return { name: "Écoutés récemment", kind: "Playlist auto", ids, auto: true, ic: "clock", empty: "Rien pour l'instant." }; }
  const p = L.playlists.find((x) => x.id === id);
  if (p) return { name: p.name, kind: "Playlist", ids: p.ids.filter(hasT), p, empty: "Ajoute des titres avec le bouton ⋯ à côté de n'importe quel titre, puis « Ajouter à une playlist »." };
  return null;
}
function ctxResolve(ref) {
  const [type, ...rest] = ref.split(":"); const key = rest.join(":");
  if (type === "tracks") return { ids: sortedTrackIds(UI.trackSort), label: "Tous les titres" };
  if (type === "album") { const a = L.albums.get(key); return a ? { ids: a.tracks, label: a.title } : null; }
  if (type === "artist") { const a = L.artists.get(key); return a ? { ids: artistTrackIds(key), label: a.name } : null; }
  if (type === "list") { const s = listSpec(key); return s ? { ids: s.ids, label: s.name } : null; }
  if (type === "mix") return { ids: shuffleArr(L.sorted.tracks.filter((x) => L.files.has(x))).slice(0, 100), label: "Mix au hasard" };
  return null;
}
function playCtx(ref, { shuffle = false, start = 0 } = {}) {
  if (Q.ref === ref && Q.current && !shuffle && start === 0) { Player.toggle(); return; }
  const c = ctxResolve(ref); if (!c || !c.ids.length) return toast("Rien à lire ici pour l'instant.");
  if (shuffle && !Q.shuffle) Q.toggleShuffle();
  Q.playList(c.ids, shuffle ? Math.floor(Math.random() * c.ids.length) : start, c.label, ref);
}

function statsHTML() {
  const days = []; const now = new Date();
  for (let i = 6; i >= 0; i--) { const d = new Date(now); d.setDate(now.getDate() - i); days.push({ d, s: L.days[dayKey(d)] || 0 }); }
  const week = days.reduce((s, x) => s + x.s, 0);
  const totalPlays = Object.values(L.stats).reduce((s, x) => s + (x.p || 0), 0);
  if (!week && !totalPlays) return "";
  const max = Math.max(...days.map((x) => x.s), 1);
  const top = topArtists(1)[0]; const tt = topTracks(1)[0]; const tTrack = tt && L.tracks.get(tt);
  const D = ["D", "L", "M", "M", "J", "V", "S"];
  return html`<section class="sec"><div class="sec-head"><h2 class="h-sec">Ton écoute</h2></div><div class="stats">
<div class="stat"><small>Ces 7 derniers jours</small><div class="v">${fmtLong(week)}</div><div class="week" role="img" aria-label="Minutes écoutées par jour sur 7 jours">${days.map((x) => html`<div title="${x.d.toLocaleDateString("fr-FR", { weekday: "long" })} : ${fmtLong(x.s)}"><i class="${x.s ? "" : "zero"}" style="height:${Math.max(4, (x.s / max) * 100)}%"></i><span>${D[x.d.getDay()]}</span></div>`)}</div></div>
<div class="stat"><small>Artiste n°1</small><div class="v">${top ? top.artist.name : "–"}</div><div class="s">${top ? plural(top.plays, "écoute", "écoutes") : "Pas encore assez d'écoutes"}</div></div>
<div class="stat"><small>Titre n°1</small><div class="v">${tTrack ? tTrack.title : "–"}</div><div class="s">${tTrack ? `${tTrack.artist} · ${plural(playsOf(tt), "écoute", "écoutes")}` : ""}</div></div>
<div class="stat"><small>Écoutes au total</small><div class="v mono">${totalPlays.toLocaleString("fr-FR")}</div><div class="s">un titre compte après 30 s</div></div>
</div></section>`;
}

/* ===================== actions & démarrage ===================== */
function listOf(el) { const w = el.closest("[data-list]"); return w ? LISTS.get(w.dataset.list) : null; }
